<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>양세찬 게임 (Who am I?) - Retro 8-bit</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @font-face {
            font-family: 'DungGeunMo';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/DungGeunMo.woff') format('woff');
            font-weight: normal; font-style: normal;
        }

        :root {
            --bg: #000;
            --text: #fff;
            --primary: #ffd700; 
            --secondary: #ff007f; 
            --border: 4px solid #fff;
            --panel-bg: #111;
        }

        * { box-sizing: border-box; font-family: 'DungGeunMo', sans-serif; }

        body {
            background-color: var(--bg); color: var(--text);
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden; user-select: none;
            background-image: linear-gradient(#111 2px, transparent 2px), linear-gradient(90deg, #111 2px, transparent 2px);
            background-size: 40px 40px;
        }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 10;
        }
        .screen.active { opacity: 1; pointer-events: auto; z-index: 20; }

        h1.title {
            font-size: 4rem; color: var(--primary); text-shadow: 4px 4px 0 #555, 8px 8px 0 #222;
            margin-bottom: 20px; text-align: center; letter-spacing: 2px; line-height: 1.2;
        }

        .btn {
            background: var(--bg); border: var(--border); color: var(--text);
            padding: 15px 30px; font-size: 1.5rem; cursor: pointer;
            box-shadow: 6px 6px 0 #555; transition: 0.1s; margin-bottom: 15px; width: 320px; text-align: center;
        }
        .btn:hover { transform: translate(2px, 2px); box-shadow: 4px 4px 0 #fff; background: #222; }
        .btn:active { transform: translate(6px, 6px); box-shadow: none; }
        .btn-primary { background: var(--primary); color: #000; border-color: #fff; box-shadow: 6px 6px 0 var(--secondary); }
        .btn-primary:hover { background: #ffeb3b; box-shadow: 4px 4px 0 var(--secondary); }
        .btn:disabled { background: #333; color: #777; border-color: #555; box-shadow: none; cursor: not-allowed; transform: none; }

        .panel {
            background: var(--panel-bg); border: var(--border); box-shadow: 10px 10px 0 #555;
            padding: 30px; border-radius: 0; text-align: center; max-width: 500px; width: 90%;
        }

        .input-box {
            width: 100%; padding: 15px; font-size: 1.2rem; background: #000; color: #fff;
            border: 4px solid #fff; outline: none; margin-bottom: 15px; text-align: center; box-shadow: inset 4px 4px 0 #222;
        }
        .input-box:focus { border-color: var(--primary); }

        /* 32x32 도트 에디터 */
        .editor-container { display: flex; gap: 20px; margin-bottom: 20px; align-items: center; justify-content: center; flex-wrap: wrap; }
        canvas#dotCanvas {
            border: 4px solid #fff; background: #222; cursor: crosshair;
            width: 256px; height: 256px; image-rendering: pixelated; box-shadow: 6px 6px 0 #555;
        }
        .palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .color-swatch { width: 40px; height: 40px; border: 3px solid #fff; cursor: pointer; }
        .color-swatch.active { border-color: var(--primary); transform: scale(1.1); }
        .tool-btn { background: #333; border: 2px solid #fff; color: #fff; padding: 10px; cursor: pointer; font-size: 1rem; margin-top:10px; width: 100%; }

        /* 인게임 UI */
        .game-layout { display: flex; flex-direction: column; width: 100%; height: 100%; max-width: 1000px; padding: 10px; }
        
        .stage-area {
            flex: 1; display: flex; justify-content: center; align-items: center; gap: 20px; flex-wrap: wrap;
            padding: 60px 10px 20px 10px; background: rgba(0,0,0,0.5); border: 4px solid #444; margin-bottom: 10px; position: relative; overflow-y: auto;
        }
        
        .char-wrap { position: relative; display: flex; flex-direction: column; align-items: center; width: 100px; margin-top: 30px;}
        .char-wrap.turn .pixel-avatar { border-color: var(--primary); box-shadow: 0 0 20px var(--primary); transform: scale(1.1); }
        .char-wrap.done { opacity: 0.4; } 

        .pixel-avatar {
            width: 80px; height: 80px; border: 4px solid #fff; background: #222;
            image-rendering: pixelated; box-shadow: 4px 4px 0 #000; transition: 0.2s;
        }
        
        .name-tag { margin-top: 10px; font-size: 0.9rem; background: #111; border: 2px solid #fff; padding: 2px 6px; white-space: nowrap; max-width: 100px; overflow:hidden; text-overflow:ellipsis;}
        
        .post-it {
            position: absolute; top: -35px; background: #ffeb3b; color: #000; border: 2px solid #000;
            padding: 4px 8px; font-size: 1.1rem; font-weight: bold; transform: rotate(-5deg);
            box-shadow: 2px 2px 0 rgba(0,0,0,0.5); z-index: 5; white-space: nowrap; max-width: 120px; overflow: hidden; text-overflow: ellipsis;
        }
        
        /* 말풍선 */
        .speech-bubble {
            position: absolute; bottom: 100%; margin-bottom: 0px; 
            background: #fff; color: #000; border: 4px solid #000;
            padding: 8px 12px; border-radius: 8px; font-size: 1rem; font-weight: bold; z-index: 10;
            min-width: 120px; max-width: 160px; max-height: 80px;
            text-align: center; opacity: 0; transition: 0.2s; 
            pointer-events: auto; overflow-y: auto; word-break: break-word;
        }
        .speech-bubble.show { opacity: 1; margin-bottom: 10px; }
        .speech-bubble::after {
            content: ''; position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%);
            border-width: 12px 10px 0; border-style: solid; border-color: #000 transparent transparent transparent;
        }
        .speech-bubble::-webkit-scrollbar { width: 6px; }
        .speech-bubble::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }

        .control-area { height: 230px; display: flex; gap: 10px; }
        
        /* ★ 마인크래프트 스타일 채팅/로그 패널 ★ */
        .chat-log { 
            flex: 1; border: 4px solid #fff; background: rgba(0, 0, 0, 0.6); 
            padding: 10px; overflow-y: auto; font-size: 1rem; line-height: 1.5; 
        }
        .chat-msg {
            margin: 5px 0; padding: 2px; text-shadow: 2px 2px 0 #000;
            opacity: 1; transition: opacity 0.5s ease-out; word-break: break-word;
        }
        .chat-log .sys { color: var(--primary); }

        .action-panel { width: 300px; border: 4px solid #fff; background: #222; padding: 15px; display: flex; flex-direction: column; justify-content: center; }
        
        .action-desc { 
            font-size: 1.1rem; margin-bottom: 10px; color: var(--primary); text-align: center; line-height: 1.4;
            word-break: break-word; padding: 5px; 
            background: rgba(0,0,0,0.4); border: 1px solid #444; border-radius: 4px;
        }

        .retro-details {
            background: #000; border: 2px solid var(--primary); padding: 8px; margin-bottom: 10px;
            text-align: left; font-size: 1rem; border-radius: 4px;
        }
        .retro-details summary {
            cursor: pointer; color: var(--primary); font-weight: bold; outline: none; user-select: none;
        }
        .retro-details summary:hover { color: #fff; }
        .retro-details .q-text {
            margin-top: 8px; padding-top: 8px; border-top: 2px dashed #444; color: #fff;
            line-height: 1.4; max-height: 80px; overflow-y: auto; word-break: break-word;
        }
        .retro-details .q-text::-webkit-scrollbar { width: 8px; }
        .retro-details .q-text::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }
        .retro-details .q-text::-webkit-scrollbar-track { background: #111; }

        .tut-stage { position: relative; width: 100%; max-width: 800px; height: 400px; border: 4px solid #fff; background: #111; overflow: hidden; box-shadow: 10px 10px 0 #555; }
        .tut-text { position: absolute; top: 20px; width: 100%; text-align: center; font-size: 1.5rem; color: var(--primary); text-shadow: 2px 2px 0 #000; z-index: 10; }
        .tut-layer { position: absolute; width: 100%; height: 100%; top: 0; left: 0; }

        @media (max-width: 700px) {
            h1.title { font-size: 2.5rem; }
            .btn { width: 90%; font-size: 1.2rem; }
            canvas#dotCanvas { width: 200px; height: 200px; }
            .control-area { flex-direction: column; height: auto; }
            .action-panel { width: 100%; }
            .chat-log { height: 120px; }
            .pixel-avatar { width: 50px; height: 50px; }
            .tut-stage { height: 300px; }
        }
    </style>
</head>
<body>

    <!-- 1. 메인 메뉴 -->
    <div id="screen-menu" class="screen active">
        <h1 class="title">양세찬 게임<br><span style="font-size:1.5rem; color:#fff;">(이마 단어 맞히기)</span></h1>
        <button class="btn" onclick="showScreen('screen-settings')">내 캐릭터 그리기 (도트)</button>
        <button class="btn btn-primary" onclick="startAIGame()">싱글 플레이 (AI 모드)</button>
        <button class="btn" onclick="startHostRoom()">온라인: 방 만들기</button>
        <button class="btn" onclick="showScreen('screen-join')">온라인: 방 접속하기</button>
        <button class="btn" style="border-color:#555;" onclick="startTutorial()">모션 그래픽 튜토리얼</button>
    </div>

    <!-- 2. 환경 설정 (도트 에디터) -->
    <div id="screen-settings" class="screen">
        <div class="panel" style="max-width:600px;">
            <h2 style="color:var(--primary); margin-top:0;">나만의 도트 아바타 (32x32)</h2>
            <p style="color:#aaa; font-size:0.9rem;">그린 아바타는 게임 내 캐릭터로 사용되며 자동 저장됩니다.</p>
            <div class="editor-container">
                <canvas id="dotCanvas" width="32" height="32"></canvas>
                <div>
                    <div class="palette">
                        <div class="color-swatch active" style="background:#ffffff" onclick="setColor('#ffffff', this)"></div>
                        <div class="color-swatch" style="background:#000000" onclick="setColor('#000000', this)"></div>
                        <div class="color-swatch" style="background:#ff0000" onclick="setColor('#ff0000', this)"></div>
                        <div class="color-swatch" style="background:#00ff00" onclick="setColor('#00ff00', this)"></div>
                        <div class="color-swatch" style="background:#0000ff" onclick="setColor('#0000ff', this)"></div>
                        <div class="color-swatch" style="background:#ffff00" onclick="setColor('#ffff00', this)"></div>
                        <div class="color-swatch" style="background:#ff00ff" onclick="setColor('#ff00ff', this)"></div>
                        <div class="color-swatch" style="background:#00ffff" onclick="setColor('#00ffff', this)"></div>
                    </div>
                    <button class="tool-btn" onclick="clearCanvas()">전체 지우기</button>
                </div>
            </div>
            <button class="btn btn-primary" style="width:100%; margin-bottom:0;" onclick="saveAvatar()">저장 후 메인으로</button>
        </div>
    </div>

    <!-- 3. 온라인 방 로비 -->
    <div id="screen-host" class="screen">
        <div class="panel">
            <h2 style="color:var(--primary);">방 개설 완료</h2>
            <div id="room-code-display" style="font-size:3.5rem; letter-spacing:5px; margin:20px 0;">---</div>
            <p>대기중 인원: <span id="player-count" style="color:var(--secondary); font-weight:bold; font-size:1.5rem;">1</span> / 9 명</p>
            <button class="btn btn-primary" onclick="startGamePhase()" id="start-game-btn" style="width:100%; margin-top:20px;" disabled>인원 부족 (시작 불가)</button>
            <button class="btn" style="width:100%;" onclick="location.reload()">취소</button>
        </div>
    </div>
    
    <div id="screen-join" class="screen">
        <div class="panel">
            <h2 style="color:var(--primary);">방 접속</h2>
            <input type="text" id="join-code" class="input-box" placeholder="5자리 방 코드" maxlength="5">
            <button class="btn btn-primary" style="width:100%;" onclick="joinRoom()">접속</button>
            <p id="join-status" style="color:var(--secondary); margin-top:10px;"></p>
            <button class="btn" style="width:100%;" onclick="showScreen('screen-menu')">뒤로가기</button>
        </div>
    </div>

    <!-- 4. 단어 부여 (Assign Word) 단계 -->
    <div id="screen-assign" class="screen">
        <div class="panel">
            <h2 style="color:var(--primary);">단어 정해주기</h2>
            <p id="assign-desc">오른쪽에 있는 <b style="color:var(--secondary)" id="assign-target-name">???</b>님 이마에 붙일 단어를 입력하세요!</p>
            <input type="text" id="assign-word-input" class="input-box" placeholder="예: 유재석, 사과, 강아지">
            <button class="btn btn-primary" style="width:100%;" onclick="submitAssignedWord()">결정!</button>
            <p id="assign-wait-msg" style="color:#aaa; display:none;">다른 플레이어들을 기다리는 중...</p>
        </div>
    </div>

    <!-- 5. 인게임 화면 -->
    <div id="screen-game" class="screen">
        <div class="game-layout">
            <div class="stage-area" id="stage-area"></div>
            
            <div class="control-area">
                <div class="chat-log" id="chat-log"></div>
                <div class="action-panel">
                    <div class="action-desc" id="action-desc">상대방 턴 대기중...</div>
                    <div id="action-controls"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 6. 튜토리얼 화면 -->
    <div id="screen-tutorial" class="screen">
        <div class="tut-stage" id="tut-stage">
            <div class="tut-text" id="tut-title">가이드</div>
            <div class="tut-layer" id="tut-layer"></div>
        </div>
        <div style="display:flex; gap:20px; margin-top:20px;">
            <button class="btn" style="width:150px;" onclick="showScreen('screen-menu')">종료</button>
            <button class="btn btn-primary" style="width:150px;" onclick="nextTutStep()" id="tut-next-btn">시작</button>
        </div>
    </div>

<script>
    // ==========================================
    // 효과음 (Web Audio API)
    // ==========================================
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function initAudio() { if(!audioCtx) { audioCtx = new AudioContext(); audioCtx.resume(); } }
    
    function playSound(type) {
        if(!audioCtx) return;
        const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination); const t = audioCtx.currentTime;

        if (type === 'select') {
            o.type = 'square'; o.frequency.setValueAtTime(400, t); o.frequency.exponentialRampToValueAtTime(100, t + 0.1);
            g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.01, t + 0.1); o.start(t); o.stop(t + 0.1);
        } else if (type === 'type') {
            o.type = 'triangle'; o.frequency.setValueAtTime(800, t);
            g.gain.setValueAtTime(0.1, t); g.gain.linearRampToValueAtTime(0, t + 0.05); o.start(t); o.stop(t + 0.05);
        } else if (type === 'bubble') {
            o.type = 'sine'; o.frequency.setValueAtTime(600, t); o.frequency.linearRampToValueAtTime(900, t + 0.1);
            g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.3, t+0.05); g.gain.linearRampToValueAtTime(0, t+0.1); o.start(t); o.stop(t + 0.1);
        } else if (type === 'correct') {
            o.type = 'square'; [523.25, 659.25, 783.99].forEach((f, i) => o.frequency.setValueAtTime(f, t + i*0.1));
            g.gain.setValueAtTime(0.2, t); g.gain.linearRampToValueAtTime(0, t+0.4); o.start(t); o.stop(t + 0.4);
        } else if (type === 'wrong') {
            o.type = 'sawtooth'; o.frequency.setValueAtTime(150, t); o.frequency.linearRampToValueAtTime(80, t + 0.3);
            g.gain.setValueAtTime(0.3, t); g.gain.linearRampToValueAtTime(0, t+0.3); o.start(t); o.stop(t + 0.3);
        } else if (type === 'win') {
            o.type = 'square'; [523, 659, 783, 1046, 783, 1046].forEach((f, i) => o.frequency.setValueAtTime(f, t + i*0.15));
            g.gain.setValueAtTime(0.3, t); g.gain.linearRampToValueAtTime(0, t+1.2); o.start(t); o.stop(t + 1.2);
        }
    }

    function showScreen(id) {
        initAudio(); playSound('select');
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'screen-settings') loadAvatar(); 
    }

    // ==========================================
    // 32x32 픽셀 에디터 로직
    // ==========================================
    const canvas = document.getElementById('dotCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false, currentColor = '#ffffff';

    function initCanvas() {
        ctx.fillStyle = '#222'; ctx.fillRect(0,0,32,32); 
        ctx.fillStyle = '#ffd700'; ctx.fillRect(8,8, 16,16); 
        ctx.fillStyle = '#000'; ctx.fillRect(11,12,2,2); ctx.fillRect(19,12,2,2); ctx.fillRect(12,18,8,2);
    }

    function loadAvatar() {
        const saved = localStorage.getItem('myAvatar');
        if(saved) { const img = new Image(); img.onload = () => { ctx.clearRect(0,0,32,32); ctx.drawImage(img, 0, 0); }; img.src = saved; } 
        else { initCanvas(); }
    }

    function saveAvatar() {
        localStorage.setItem('myAvatar', canvas.toDataURL('image/png'));
        playSound('select'); showScreen('screen-menu');
    }

    function setColor(color, el) {
        currentColor = color; playSound('select');
        document.querySelectorAll('.color-swatch').forEach(e => e.classList.remove('active')); el.classList.add('active');
    }

    function clearCanvas() { playSound('wrong'); ctx.fillStyle = '#222'; ctx.fillRect(0,0,32,32); }

    function drawPixel(e) {
        if(!isDrawing) return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width; const scaleY = canvas.height / rect.height;
        const x = Math.floor((e.clientX - rect.left) * scaleX); const y = Math.floor((e.clientY - rect.top) * scaleY);
        ctx.fillStyle = currentColor; ctx.fillRect(x, y, 1, 1);
        if(Math.random() > 0.5) playSound('type');
    }

    canvas.addEventListener('mousedown', e => { isDrawing = true; drawPixel(e); });
    canvas.addEventListener('mousemove', drawPixel);
    window.addEventListener('mouseup', () => isDrawing = false);
    canvas.addEventListener('touchstart', e => { isDrawing = true; drawPixel(e.touches[0]); });
    canvas.addEventListener('touchmove', e => { e.preventDefault(); drawPixel(e.touches[0]); }, {passive:false});
    window.addEventListener('touchend', () => isDrawing = false);

    function getMyAvatar() {
        let a = localStorage.getItem('myAvatar');
        if(!a) { initCanvas(); a = canvas.toDataURL(); localStorage.setItem('myAvatar', a); }
        return a;
    }

    // ==========================================
    // 네트워크 및 상태 관리 (Host 엔진)
    // ==========================================
    const APP_PREFIX = 'ysc-';
    let peer, conn, gameMode = 'ONLINE', myId = '';
    
    let hostState = {
        phase: 'LOBBY', 
        subPhase: '', 
        players: [], 
        turnIdx: 0, currentQuestion: '', answers: {}, winner: null
    };
    let connections = [];

    function startHostRoom() {
        showScreen('screen-host'); gameMode = 'ONLINE'; const code = Math.random().toString(36).substring(2,7).toUpperCase();
        document.getElementById('room-code-display').innerText = code;
        peer = new Peer(APP_PREFIX + code);
        peer.on('open', id => {
            myId = id; hostState.players = [{id: myId, name: 'Host(나)', avatar: getMyAvatar(), targetWord:'', isDone:false}]; updateLobby();
        });
        peer.on('connection', c => {
            if(hostState.players.length >= 9) { c.close(); return; } 
            connections.push(c);
            c.on('data', d => {
                if(d.type === 'JOIN') {
                    hostState.players.push({id: c.peer, name: d.name, avatar: d.avatar, targetWord:'', isDone:false}); updateLobby();
                } else { handleGameAction(c.peer, d); }
            });
            c.on('close', () => { hostState.players = hostState.players.filter(p=>p.id!==c.peer); connections = connections.filter(x=>x.peer!==c.peer); updateLobby(); });
        });
    }

    function updateLobby() {
        document.getElementById('player-count').innerText = hostState.players.length;
        const btn = document.getElementById('start-game-btn');
        if(hostState.players.length >= 2 && hostState.players.length <= 9) {
            btn.disabled = false;
            btn.innerText = `시작하기 (${hostState.players.length}명)`;
        } else {
            btn.disabled = true;
            btn.innerText = "인원 부족 (시작 불가)";
        }
    }

    function joinRoom() {
        gameMode = 'ONLINE'; const code = document.getElementById('join-code').value.trim().toUpperCase();
        if(code.length!==5) return alert('5자리 코드를 입력하세요.');
        document.getElementById('join-status').innerText = '접속 중...'; peer = new Peer();
        peer.on('open', id => {
            myId = id; conn = peer.connect(APP_PREFIX + code, {reliable:true});
            conn.on('open', () => { conn.send({type:'JOIN', name: 'Guest_'+id.substring(0,3), avatar: getMyAvatar()}); document.getElementById('join-status').innerText = '호스트 대기중...'; });
            conn.on('data', d => syncClientUI(d));
            conn.on('close', () => { alert('연결이 끊어졌습니다.'); location.reload(); });
        });
        peer.on('error', () => document.getElementById('join-status').innerText = '방을 찾을 수 없습니다 (또는 9명 꽉참).');
    }

    function sanitizeState(targetId) {
        let copy = JSON.parse(JSON.stringify(hostState));
        let me = copy.players.find(p => p.id === targetId);
        if(me && !me.isDone && copy.phase === 'GAME') me.targetWord = '???';
        return copy;
    }

    function broadcast() {
        if(gameMode === 'ONLINE') connections.forEach(c => c.send(sanitizeState(c.peer)));
        syncClientUI(sanitizeState(myId)); 
    }

    function startGamePhase() {
        hostState.phase = 'ASSIGN'; hostState.turnIdx = 0; broadcast();
    }

    function handleGameAction(pId, action) {
        if(hostState.phase === 'ASSIGN' && action.type === 'ASSIGN_WORD') {
            const pIdx = hostState.players.findIndex(p=>p.id === pId);
            const target = hostState.players[(pIdx + 1) % hostState.players.length];
            target.targetWord = action.word; target.assignedBy = pId;
            
            if(hostState.players.every(p => p.targetWord !== '')) {
                hostState.phase = 'GAME'; hostState.subPhase = 'QUESTION'; broadcast();
            } else { broadcast(); } 
        }
        else if(hostState.phase === 'GAME') {
            const curP = hostState.players[hostState.turnIdx];
            
            if(action.type === 'ASK' && hostState.subPhase === 'QUESTION' && pId === curP.id) {
                hostState.currentQuestion = action.text; hostState.answers = {};
                hostState.subPhase = 'ANSWER'; hostState.msgTrigger = {id: pId, text: action.text}; broadcast();
            }
            else if(action.type === 'ANSWER' && hostState.subPhase === 'ANSWER' && pId !== curP.id && !hostState.players.find(p=>p.id===pId).isDone) {
                hostState.answers[pId] = action.text;
                hostState.msgTrigger = {id: pId, text: action.text};
                
                const activeOthers = hostState.players.filter(p => !p.isDone && p.id !== curP.id);
                if(Object.keys(hostState.answers).length >= activeOthers.length) {
                    hostState.subPhase = 'GUESS_OR_PASS';
                }
                broadcast();
            }
            else if(action.type === 'PASS' && hostState.subPhase === 'GUESS_OR_PASS' && pId === curP.id) {
                nextTurn(); broadcast();
            }
            else if(action.type === 'GUESS' && hostState.subPhase === 'GUESS_OR_PASS' && pId === curP.id) {
                hostState.msgTrigger = {id: pId, text: `정답도전: ${action.word}!`};
                if(curP.targetWord === action.word) {
                    curP.isDone = true; hostState.soundTrigger = 'correct';
                    const actives = hostState.players.filter(p=>!p.isDone);
                    if(actives.length <= 1) { hostState.phase = 'GAME_OVER'; hostState.winner = curP; hostState.soundTrigger='win'; }
                    else { nextTurn(); }
                } else {
                    hostState.soundTrigger = 'wrong'; nextTurn(); 
                }
                broadcast();
            }
        }
    }

    function nextTurn() {
        hostState.currentQuestion = ''; hostState.answers = {}; hostState.subPhase = 'QUESTION';
        do { hostState.turnIdx = (hostState.turnIdx + 1) % hostState.players.length; } while(hostState.players[hostState.turnIdx].isDone);
    }

    function sendAction(action) {
        playSound('type');
        if(gameMode === 'ONLINE') { if(conn) conn.send(action); else handleGameAction(myId, action); }
        else if(gameMode === 'AI') { handleGameAction(myId, action); }
    }

    // ==========================================
    // AI 싱글 플레이 로직
    // ==========================================
    function startAIGame() {
        gameMode = 'AI'; myId = 'ME'; showScreen('screen-game');
        hostState.players = [
            {id: myId, name: '나', avatar: getMyAvatar(), targetWord:'', isDone:false},
            {id: 'AI1', name: 'AI 유재석', avatar: generateBotAvatar('#ff007f'), targetWord:'', isDone:false},
            {id: 'AI2', name: 'AI 박명수', avatar: generateBotAvatar('#00e5ff'), targetWord:'', isDone:false}
        ];
        startGamePhase();
    }

    function generateBotAvatar(color) {
        const c = document.createElement('canvas'); c.width=32; c.height=32; const tx = c.getContext('2d');
        tx.fillStyle = '#222'; tx.fillRect(0,0,32,32); tx.fillStyle = color; tx.fillRect(8,8,16,16);
        tx.fillStyle='#fff'; tx.fillRect(11,12,2,2); tx.fillRect(19,12,2,2); tx.fillRect(12,20,8,2); return c.toDataURL();
    }

    function triggerAI() {
        if(gameMode !== 'AI' || hostState.phase === 'GAME_OVER') return;
        
        if(hostState.phase === 'ASSIGN') {
            let allAssigned = true;
            hostState.players.forEach((p, idx) => {
                if(p.id !== myId && p.targetWord === '') {
                    allAssigned = false;
                    const words = ['아이폰', '햄버거', '지구', '마동석', '피카츄', '호랑이', '김치찌개'];
                    setTimeout(() => handleGameAction(p.id, {type:'ASSIGN_WORD', word: words[Math.floor(Math.random()*words.length)]}), 1000 + Math.random()*1000);
                }
            });
            return;
        }

        const curP = hostState.players[hostState.turnIdx];
        
        if(curP.id !== myId && hostState.subPhase === 'QUESTION') {
            setTimeout(() => {
                const qs = ['저 사람인가요?', '먹을 수 있나요?', 'TV에 나오나요?', '동물인가요?'];
                handleGameAction(curP.id, {type:'ASK', text: qs[Math.floor(Math.random()*qs.length)]});
            }, 1500);
        }
        else if(hostState.subPhase === 'ANSWER') {
            hostState.players.forEach(p => {
                if(p.id !== myId && !p.isDone && p.id !== curP.id && !hostState.answers[p.id]) {
                    setTimeout(() => {
                        const ans = ['네!', '아니오', '글쎄요..', '아마도?'];
                        handleGameAction(p.id, {type:'ANSWER', text: ans[Math.floor(Math.random()*ans.length)]});
                    }, 1000 + Math.random()*2000);
                }
            });
        }
        else if(curP.id !== myId && hostState.subPhase === 'GUESS_OR_PASS') {
            setTimeout(() => {
                if(Math.random() > 0.8) handleGameAction(curP.id, {type:'GUESS', word: curP.targetWord}); 
                else handleGameAction(curP.id, {type:'PASS'});
            }, 1500);
        }
    }

    // ==========================================
    // 클라이언트 UI 렌더링 동기화
    // ==========================================
    let currentState = null;

    function syncClientUI(state) {
        currentState = state;
        if(state.soundTrigger) playSound(state.soundTrigger);

        if(state.phase === 'ASSIGN') {
            showScreen('screen-assign');
            const myIdx = state.players.findIndex(p=>p.id === myId);
            const target = state.players[(myIdx + 1) % state.players.length];
            document.getElementById('assign-target-name').innerText = target.name;
            
            if(target.targetWord !== '') {
                document.getElementById('assign-word-input').style.display = 'none';
                document.getElementById('assign-wait-msg').style.display = 'block';
            }
        } 
        else if(state.phase === 'GAME' || state.phase === 'GAME_OVER') {
            if(!document.getElementById('screen-game').classList.contains('active')) showScreen('screen-game');
            renderGameBoard(state);
            renderControls(state);
        }

        if(state.msgTrigger) {
            playSound('bubble'); addLog(state.players.find(p=>p.id===state.msgTrigger.id).name, state.msgTrigger.text);
            const bubble = document.getElementById(`bubble-${state.msgTrigger.id}`);
            if(bubble) {
                bubble.innerText = state.msgTrigger.text; bubble.classList.add('show');
                setTimeout(() => bubble.classList.remove('show'), 3000);
            }
            state.msgTrigger = null; 
        }

        if(gameMode === 'AI') triggerAI();
    }

    function submitAssignedWord() {
        const val = document.getElementById('assign-word-input').value.trim();
        if(!val) return; sendAction({type: 'ASSIGN_WORD', word: val});
    }

    function renderGameBoard(state) {
        const stage = document.getElementById('stage-area'); stage.innerHTML = '';
        state.players.forEach(p => {
            const wrap = document.createElement('div');
            wrap.className = `char-wrap ${state.turnIdx !== null && state.players[state.turnIdx].id === p.id ? 'turn' : ''} ${p.isDone ? 'done' : ''}`;
            
            const postIt = document.createElement('div'); postIt.className = 'post-it'; postIt.innerText = p.targetWord; 
            const bubble = document.createElement('div'); bubble.className = 'speech-bubble'; bubble.id = `bubble-${p.id}`;
            const img = document.createElement('img'); img.className = 'pixel-avatar'; img.src = p.avatar;
            const name = document.createElement('div'); name.className = 'name-tag'; name.innerText = p.name;

            wrap.appendChild(postIt); wrap.appendChild(bubble); wrap.appendChild(img); wrap.appendChild(name);
            stage.appendChild(wrap);
        });
    }

    function renderControls(state) {
        const desc = document.getElementById('action-desc'); 
        const ctrl = document.getElementById('action-controls'); 
        ctrl.innerHTML = '';
        
        if(state.phase === 'GAME_OVER') { 
            desc.innerText = `게임 종료! 승리: ${state.winner.name}`; 
            desc.style.color = '#2ecc71'; playSound('win'); return; 
        }

        const curP = state.players[state.turnIdx]; 
        const isMyTurn = curP.id === myId;

        if(state.subPhase === 'QUESTION') {
            if(isMyTurn) {
                desc.innerText = "나의 턴! 질문하세요.";
                ctrl.innerHTML = `<input type="text" id="game-input" class="input-box" placeholder="예: 나 사람이야?"><button class="btn btn-primary" style="width:100%;" onclick="sendAsk()">질문하기</button>`;
            } else { desc.innerText = `${curP.name} 님이 질문을 고민 중입니다...`; }
        } 
        else if(state.subPhase === 'ANSWER') {
            if(isMyTurn) { 
                desc.innerHTML = `
                    <details class="retro-details">
                        <summary>▶ 내 질문 보기 (클릭)</summary>
                        <div class="q-text">${state.currentQuestion}</div>
                    </details>
                    <div style="font-size:1rem; color:#ccc;">다른 사람들의 대답을 기다리는 중...</div>
                `;
            } 
            else {
                if(!state.players.find(p=>p.id===myId).isDone && !state.answers[myId]) {
                    desc.innerHTML = `
                        <details class="retro-details" open>
                            <summary>▶ 질문 확인하기 (클릭)</summary>
                            <div class="q-text">${state.currentQuestion}</div>
                        </details>
                        <div style="font-size:1rem; color:#ccc; margin-top:5px;">대답을 적어주세요!</div>
                    `;
                    ctrl.innerHTML = `<input type="text" id="game-input" class="input-box" placeholder="예: 네, 아니오"><button class="btn btn-primary" style="width:100%;" onclick="sendAnswer()">대답하기</button>`;
                } else { desc.innerText = "대답 완료. 대기중..."; }
            }
        }
        else if(state.subPhase === 'GUESS_OR_PASS') {
            if(isMyTurn) {
                desc.innerText = "단어를 유추했나요?";
                ctrl.innerHTML = `
                    <input type="text" id="game-input" class="input-box" placeholder="정답 입력">
                    <div style="display:flex; gap:10px;">
                        <button class="btn btn-primary" style="width:50%; font-size:1.1rem; padding:10px;" onclick="sendGuess()">정답도전</button>
                        <button class="btn" style="width:50%; font-size:1.1rem; padding:10px;" onclick="sendAction({type:'PASS'})">넘기기</button>
                    </div>`;
            } else { desc.innerText = `${curP.name} 님이 정답을 고민 중입니다...`; }
        }
    }

    function sendAsk() { const t = document.getElementById('game-input').value; if(t) sendAction({type:'ASK', text:t}); }
    function sendAnswer() { const t = document.getElementById('game-input').value; if(t) sendAction({type:'ANSWER', text:t}); }
    function sendGuess() { const t = document.getElementById('game-input').value; if(t) sendAction({type:'GUESS', word:t}); }

    // ★ 마인크래프트 스타일 페이드아웃 채팅/로그 ★
    function addLog(name, text) {
        const log = document.getElementById('chat-log'); 
        const msg = document.createElement('p');
        msg.className = 'chat-msg';
        msg.innerHTML = `<b class="sys">[${name}]</b> ${text}`;
        log.appendChild(msg); 
        log.scrollTop = log.scrollHeight;
        
        // 7초 후 마크 채팅처럼 서서히 사라짐
        setTimeout(() => {
            msg.style.opacity = '0';
            setTimeout(() => {
                if(msg.parentNode) msg.remove();
            }, 500); // CSS 트랜지션 타임
        }, 7000);
    }

    // ==========================================
    // 모션 그래픽 튜토리얼
    // ==========================================
    let tutStep = 0, tutTimers = [];
    const tutLayer = document.getElementById('tut-layer');
    function clearTut() { tutTimers.forEach(t=>clearTimeout(t)); tutTimers=[]; tutLayer.innerHTML=''; }
    function setTutTimer(fn, d) { tutTimers.push(setTimeout(fn, d)); }

    function drawTutChar(name, word, x, isMe) {
        const w = document.createElement('div'); w.className = 'char-wrap'; w.style.position = 'absolute'; w.style.left = `calc(50% + ${x}px)`; w.style.top = '100px'; w.style.transform = 'translateX(-50%)';
        const pi = document.createElement('div'); pi.className = 'post-it'; pi.innerText = word;
        const b = document.createElement('div'); b.className = 'speech-bubble'; b.id = `tb-${name}`;
        const img = document.createElement('div'); img.className = 'pixel-avatar'; if(isMe) img.style.borderColor = 'var(--secondary)';
        const n = document.createElement('div'); n.className = 'name-tag'; n.innerText = name;
        w.appendChild(pi); w.appendChild(b); w.appendChild(img); w.appendChild(n); tutLayer.appendChild(w); return w;
    }

    function showBubble(id, text) {
        const b = document.getElementById(`tb-${id}`); playSound('bubble');
        if(b) { b.innerText = text; b.classList.add('show'); setTimeout(()=>b.classList.remove('show'), 2000); }
    }

    function startTutorial() {
        showScreen('screen-tutorial'); tutStep = 0; clearTut();
        document.getElementById('tut-next-btn').innerText = "시작";
        document.getElementById('tut-title').innerText = "양세찬 게임 룰 가이드";
    }

    function nextTutStep() {
        initAudio(); clearTut(); tutStep++;
        const title = document.getElementById('tut-title');
        document.getElementById('tut-next-btn').innerText = "다음";

        if(tutStep === 1) {
            title.innerText = "1. 내 단어는 나만 몰라요!";
            drawTutChar('나', '???', -120, true); drawTutChar('친구', '사과', 120, false);
            setTutTimer(()=>{ showBubble('나', '내 머리 위에 뭐 있지?'); }, 1000);
        } else if(tutStep === 2) {
            title.innerText = "2. 질문하고 대답 듣기";
            const me = drawTutChar('나', '???', -120, true); drawTutChar('친구', '사과', 120, false); me.classList.add('turn');
            setTutTimer(()=>{ showBubble('나', '나 먹는 건가요?'); }, 1000);
            setTutTimer(()=>{ showBubble('친구', '네! 맛있어요.'); }, 3000);
        } else if(tutStep === 3) {
            title.innerText = "3. 정답 도전!";
            const me = drawTutChar('나', '???', -120, true); drawTutChar('친구', '사과', 120, false); me.classList.add('turn');
            setTutTimer(()=>{ showBubble('나', '정답! 바나나?'); }, 1000);
            setTutTimer(()=>{ playSound('wrong'); showBubble('친구', '땡! 틀렸습니다.'); me.classList.remove('turn'); }, 2500);
        } else if(tutStep === 4) {
            title.innerText = "4. 맞히면 승리!";
            const me = drawTutChar('나', '???', -120, true); drawTutChar('친구', '사과', 120, false); me.classList.add('turn');
            setTutTimer(()=>{ showBubble('나', '정답! 사과!'); }, 1000);
            setTutTimer(()=>{ playSound('win'); showBubble('친구', '정답입니다!'); me.querySelector('.post-it').innerText = '사과'; }, 2500);
            setTutTimer(()=>{ document.getElementById('tut-next-btn').innerText = "메인으로"; }, 3000);
        } else { showScreen('screen-menu'); }
    }
</script>
